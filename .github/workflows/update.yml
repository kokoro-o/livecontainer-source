name: Update source
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update source
        id: update
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 update.py
      - name: Commit changes
        run: |
          if ! git diff --quiet -- source.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add source.json
            git commit -m 'Update app source'
            git push
          fi
      - name: Report update failures
        if: steps.update.outcome == 'failure'
        run: exit 1
